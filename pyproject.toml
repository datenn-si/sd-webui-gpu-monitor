[tool.ruff]
target-version = "py310"
line-length = 100
indent-width = 4
extend-exclude = ["node_modules", ".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E402", "E501", "B008", "B905"]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["launch", "fastapi", "pynvml"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
